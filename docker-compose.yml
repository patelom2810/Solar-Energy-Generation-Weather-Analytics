version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=solar_analytics
      - DB_PORT=3306
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=solar_analytics
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01-create_table.sql
      - ./sql/create_etl_tables.sql:/docker-entrypoint-initdb.d/02-create_etl_tables.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build: .
    command: ["python", "-m", "etl.run_pipeline"]
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=solar_analytics
      - DB_PORT=3306
      - ETL_START_DATE=${ETL_START_DATE:-2026-02-01}
      - ETL_END_DATE=${ETL_END_DATE:-2026-05-02}
      - ETL_LATITUDE=${ETL_LATITUDE:-28.6139}
      - ETL_LONGITUDE=${ETL_LONGITUDE:-77.2090}
      - ETL_RETRAIN_ON_RUN=${ETL_RETRAIN_ON_RUN:-false}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

volumes:
  mysql_data:

networks:
  default:
    name: solar_network
